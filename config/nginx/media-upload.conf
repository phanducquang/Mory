# Include INSIDE the existing server block that serves the Mory web app.
# Works for an existing HTTP or HTTPS virtual host; preserve its TLS/proxy rules.
# Example: include /home/ubuntu/mory/config/nginx/media-upload.conf;
# App validation remains 8 MiB per image; allow a small margin at the proxy.
client_max_body_size 9m;
client_body_timeout 20s;
