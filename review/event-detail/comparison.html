<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mory · Chi tiết sự kiện</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#302d38;font:16px/1.6 system-ui,sans-serif}header,main{padding:24px max(16px,4vw)}h1{margin:0;font-size:28px;letter-spacing:-.04em}p{max-width:75ch;color:#655b70}nav{display:flex;flex-wrap:wrap;gap:16px}label{display:grid;gap:6px}select,a{min-height:44px}select{font:inherit;padding:8px;border:1px solid #9888a5;background:white;border-radius:8px}a{color:#665094}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{min-width:0;margin:0}figcaption{font-weight:600;margin-bottom:12px}.frame{max-height:82vh;overflow:auto;border:1px solid #dcd3e4;border-radius:12px;background:#eee9f6}img{display:block;max-width:100%;height:auto;margin:auto}:focus-visible{outline:3px solid #302d38;outline-offset:3px}@media(max-width:700px){section{grid-template-columns:1fr}}</style><header><h1>Chi tiết sự kiện · Trước và sau</h1><p>Ảnh chính được xem đầy đủ; thao tác xóa gắn với đúng ảnh. Dữ liệu/ảnh minh họa, không dùng ảnh riêng tư của người dùng.</p><nav><label>Màn hình<select id="screen"><option value="detail">Demo</option><option value="server-detail">Tài khoản · 3 ảnh</option><option value="server-empty">Tài khoản · chưa có ảnh</option><option value="viewer">Viewer mới</option></select></label><label>Độ rộng<select id="width"><option>390</option><option>1440</option></select></label><a href="README.md">Kế hoạch và kiểm thử</a></nav></header><main><section><figure id="old"><figcaption>Trước</figcaption><div class="frame"><img id="before" alt="Chi tiết sự kiện trước chỉnh sửa"></div></figure><figure><figcaption>Sau</figcaption><div class="frame"><img id="after" alt="Chi tiết sự kiện sau chỉnh sửa"></div></figure></section></main><script>const screen=document.querySelector('#screen'),width=document.querySelector('#width');function show(){if(screen.value==='server-empty')width.value='390';document.querySelector('#old').hidden=screen.value==='viewer';for(const phase of ['before','after']){if(phase==='before'&&screen.value==='viewer')continue;document.getElementById(phase).src=phase+'/'+screen.value+'-'+width.value+'.png';}}screen.addEventListener('change',show);width.addEventListener('change',show);show();</script></html>
